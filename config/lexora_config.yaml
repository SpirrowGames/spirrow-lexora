# Lexora Configuration for AIサーバー

server:
  host: "0.0.0.0"
  port: 8110

# 統一バックエンド: Qwen3-32B (thinking/non-thinking切り替え)
routing:
  enabled: true
  default_backend: "heavy"
  default_model_for_unknown_task: "Qwen3-32B"

  # ティアベースルーティング
  # 呼び出し側は model: "light" 等のティア名を指定するだけでよい
  tiers:
    light:
      backend: "light"
      description: "軽量タスク (no thinking)"
    medium:
      backend: "heavy"
      description: "標準タスク (with thinking)"
    heavy:
      backend: "claude"
      description: "複雑なタスク (Claude API)"
    # role ルート: naysayer は別訓練分布 (Gemini) で最大独立性を取る
    # (ADR-2026-05-31-15 D-2「2 協調 1 独立」)。呼び出し側は model: "naysayer"
    naysayer:
      backend: "gemini"
      model: "gemini-3.1-pro-preview"
      description: "naysayer (別訓練分布・最大独立性、native generateContent gate)"

  # タスク分類設定
  classifier:
    enabled: true
    model: "Qwen3-32B"
    backend: "light"

  backends:
    heavy:
      type: "vllm"
      url: "http://localhost:8000"
      timeout: 300.0
      connect_timeout: 10.0
      thinking_mode: "think"
      models:
        - name: "Qwen3-32B"
          capabilities: ["code", "reasoning", "analysis"]
          description: "複雑なタスク向け (thinking mode)"
      fallback_backends:
        - "claude"

    light:
      type: "vllm"
      url: "http://localhost:8000"
      timeout: 300.0
      connect_timeout: 10.0
      thinking_mode: "no_think"
      models:
        - name: "Qwen3-32B"
          capabilities: ["summarization", "translation", "simple_qa", "general"]
          description: "軽量タスク向け (non-thinking mode)"
      fallback_backends: []

    # openai_gpt4 backend removed 2026-08-11.
    # OPENAI_API_KEY は設定されておらず、常に 401 = 常に unhealthy だった。
    # その上で GET /health は毎回 api.openai.com を叩いており、遠端が不定期に
    # 停止して 20〜40s ブロックする (素の curl でも再現、time_connect /
    # time_appconnect は常に高速で time_starttransfer だけが伸びる)。
    # heavy / light の fallback 先でもあったが、キーが無いのでフォールバック
    # しても 401 になるだけだった。再導入するならキー設定が先。

    # Google Gemini API (native generateContent, naysayer 用)
    gemini:
      type: "gemini"
      url: "https://generativelanguage.googleapis.com"
      api_key_env: "GEMINI_API_KEY"
      # paid 鍵の構造的保証 (ADR-14 D-4): Gemini 鍵は文字列から paid/free を判別
      # できないため、運用者が「課金有効 project の鍵である」ことを明示 affirm する。
      # false のままだと鍵設定時に backend 構築が fail-closed で拒否される。
      paid_key_acknowledged: true
      # データガバナンスgate無効化 (2026-06-04, オーナー Takahito 判断)。
      # tools / grounding / cached-content / 非テキスト part を拒否しなくなる。
      # ADR-2026-05-31-14 D-4 / ADR-15 C-2 の不変条件を緩める設定 — 再有効化は true。
      governance_gate_enabled: false
      # naysayer の長い生成 (output budget 32k, reasoning 込み) が Gemini 高レイテンシ
      # 時間帯に 120s を超えて 502 になっていたため、呼び出し側 mindwire の想定
      # ゲートウェイ timeout=900s (client は 930s 待機) に合わせる。2026-06-11。
      timeout: 900.0
      connect_timeout: 5.0
      # max_tokens 未指定リクエスト時の出力上限。reasoning モデル (Gemini 3.1 Pro)
      # は thinking が output 枠を消費するため、本文確保用に余裕を持たせる。
      # リクエストが max_tokens を明示した場合はそちらが優先される。
      default_max_tokens: 16000
      # health probe を外す (2026-08-11)。この backend の health_check は本物の
      # generateContent を投げる ∴ /health の 1 回ごとに課金対象の推論が 1 回走り、
      # Google 側のレイテンシ (実測 中央値 1.2s) をそのまま /health が被る。
      # 異常が出ても運用側に打てる手が無いため、確認しない方を選ぶ。
      # backend 自体は有効 — naysayer はこれで動いている。
      health_check: false
      models:
        - name: "gemini-3.1-pro-preview"
          capabilities: ["code", "reasoning", "analysis", "general"]
          description: "Google Gemini 3.1 Pro Preview (naysayer, native generateContent)"
      fallback_backends: []

    # Claude Code CLI (non-interactive mode)
    claude_code:
      type: "claude_code"
      url: "localhost"  # unused but required by schema
      timeout: 600.0
      connect_timeout: 5.0
      models:
        - name: "claude-code-opus"
          capabilities: ["code", "reasoning", "analysis", "agentic"]
          description: "Claude Code (Opus) - agentic coding with tool use"
        - name: "claude-code-sonnet"
          capabilities: ["code", "reasoning", "general"]
          description: "Claude Code (Sonnet) - fast coding assistant"
      model_mapping:
        # CLI model arg (--model)
        "claude-code-opus": "opus"
        "claude-code-sonnet": "sonnet"
        # Extra config via model_mapping (factory reads these)
        "model": "sonnet"  # default CLI model
        "max_turns": "1"  # prevent agentic tool use for simple completions
        # "working_dir": "/home/sgadmin"
      fallback_backends:
        - "claude"

    # Anthropic Claude API
    claude:
      type: "anthropic"
      url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
      timeout: 120.0
      connect_timeout: 5.0
      # health probe を外す (2026-08-11)。gemini と同じく本物の /v1/messages を
      # 投げる。加えてこの backend の health_check は「5xx でなければ到達可能」と
      # 判定するため、ANTHROPIC_API_KEY 未設定でも 401 を healthy と報告していた
      # = リクエストを処理できない backend が healthy に見えていた。
      # 誤った緑を出し続けるくらいなら、確認していないと言う方がよい。
      health_check: false
      models:
        - name: "claude-sonnet-4-20250514"
          capabilities: ["code", "reasoning", "analysis", "general"]
          description: "Anthropic Claude Sonnet 4"
      fallback_backends: []

queue:
  max_size: 1000
  default_timeout: 60.0

rate_limit:
  enabled: true
  default_rate: 10.0
  default_burst: 20

retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 30.0
  exponential_base: 2.0
  respect_retry_after: true
  max_retry_after: 60.0

fallback:
  enabled: true
  on_rate_limit: true

logging:
  level: "INFO"
  format: "json"
