# Lexora Configuration for AIサーバー

server:
  host: "0.0.0.0"
  port: 8110

# 統一バックエンド: Qwen3.8-27B (thinking/non-thinking切り替え)
# 2026-08-18 に Qwen3-32B (2025-04公開) から載せ替え。thinking の制御は
# system メッセージへの /no_think 注入から chat template kwargs
# (enable_thinking / reasoning_effort) に変更済み。vLLM 側は旧名 Qwen3-32B も
# 別名で serve しているので、モデル名直指定の呼び出し元は落ちない。
routing:
  enabled: true
  default_backend: "heavy"
  default_model_for_unknown_task: "Qwen3.8-27B"

  # ティアベースルーティング
  # 呼び出し側は model: "light" 等のティア名を指定するだけでよい
  tiers:
    light:
      backend: "light"
      description: "軽量タスク (no thinking)"
    medium:
      backend: "heavy"
      description: "標準タスク (with thinking)"
    heavy:
      backend: "deep"
      description: "複雑なタスク (Qwen3.8-27B, reasoning_effort=xhigh)"
    # role ルート: naysayer は別訓練分布 (Gemini) で最大独立性を取る
    # (ADR-2026-05-31-15 D-2「2 協調 1 独立」)。呼び出し側は model: "naysayer"
    naysayer:
      backend: "gemini"
      model: "gemini-3.1-pro-preview"
      description: "naysayer (別訓練分布・最大独立性、native generateContent gate)"

  # タスク分類設定
  classifier:
    enabled: true
    model: "Qwen3.8-27B"
    backend: "light"

  backends:
    heavy:
      type: "vllm"
      url: "http://localhost:8000"
      timeout: 300.0
      connect_timeout: 10.0
      thinking_mode: "think"
      # Qwen3.8 の chat template 既定は xhigh (最も長く考える)。medium ティアの
      # 「標準タスク」用途には過剰なので medium に落としている。low / xhigh も可。
      reasoning_effort: "medium"
      models:
        - name: "Qwen3.8-27B"
          capabilities: ["code", "reasoning", "analysis"]
          description: "複雑なタスク向け (thinking mode)"

    light:
      type: "vllm"
      url: "http://localhost:8000"
      timeout: 300.0
      connect_timeout: 10.0
      thinking_mode: "no_think"
      models:
        - name: "Qwen3.8-27B"
          capabilities: ["summarization", "translation", "simple_qa", "general"]
          description: "軽量タスク向け (non-thinking mode)"

    # heavy ティア用。2026-08-18 に Anthropic API から移した。
    # 背景: ANTHROPIC_API_KEY 未設定で heavy は 502 のまま死んでいた。CPU + メインメモリ
    # で別モデルを立てる案を検討したが、実測 44.6GB/s の帯域では
    # 収まる中で最良の Ornith-1.0-397B (SWE-bench Pro 62.2) でも約6〜7 tok/s、
    # しかもスコアは GPU の Qwen3.8-27B (61.7) とほぼ同点で上積みが無かった。
    # ∴ 同じ vLLM を向き、段差は reasoning_effort だけで付ける。
    # backend "heavy" (= medium ティア) との違いは xhigh のみ。モデルもURLも同じ。
    # ("heavy" という backend 名が medium ティアを指しているのは以前からの経緯)
    deep:
      type: "vllm"
      url: "http://localhost:8000"
      # xhigh は思考が長くなるので medium (300s) より緩める
      timeout: 600.0
      connect_timeout: 10.0
      thinking_mode: "think"
      reasoning_effort: "xhigh"
      models:
        - name: "Qwen3.8-27B"
          capabilities: ["code", "reasoning", "analysis", "general"]
          description: "複雑なタスク向け (thinking mode, reasoning_effort=xhigh)"

    # openai_gpt4 backend removed 2026-08-11.
    # OPENAI_API_KEY は設定されておらず、常に 401 = 常に unhealthy だった。
    # その上で GET /health は毎回 api.openai.com を叩いており、遠端が不定期に
    # 停止して 20〜40s ブロックする (素の curl でも再現、time_connect /
    # time_appconnect は常に高速で time_starttransfer だけが伸びる)。
    # 当時の heavy / light は fallback_backends にこの backend を挙げていたが、
    # その機構 (FallbackService) はそもそも配線されておらず動いていなかった
    # (2026-08-31 に撤去。末尾の記録を参照)。再導入するならキー設定が先。

    # Google Gemini API (native generateContent, naysayer 用)
    gemini:
      type: "gemini"
      url: "https://generativelanguage.googleapis.com"
      api_key_env: "GEMINI_API_KEY"
      # paid 鍵の構造的保証 (ADR-14 D-4): Gemini 鍵は文字列から paid/free を判別
      # できないため、運用者が「課金有効 project の鍵である」ことを明示 affirm する。
      # false のままだと鍵設定時に backend 構築が fail-closed で拒否される。
      paid_key_acknowledged: true
      # データガバナンスgate無効化 (2026-06-04, オーナー Takahito 判断)。
      # tools / grounding / cached-content / 非テキスト part を拒否しなくなる。
      # ADR-2026-05-31-14 D-4 / ADR-15 C-2 の不変条件を緩める設定 — 再有効化は true。
      governance_gate_enabled: false
      # naysayer の長い生成 (output budget 32k, reasoning 込み) が Gemini 高レイテンシ
      # 時間帯に 120s を超えて 502 になっていたため、呼び出し側 mindwire の想定
      # ゲートウェイ timeout=900s (client は 930s 待機) に合わせる。2026-06-11。
      timeout: 900.0
      connect_timeout: 5.0
      # max_tokens 未指定リクエスト時の出力上限。reasoning モデル (Gemini 3.1 Pro)
      # は thinking が output 枠を消費するため、本文確保用に余裕を持たせる。
      # リクエストが max_tokens を明示した場合はそちらが優先される。
      default_max_tokens: 16000
      # health probe を外す (2026-08-11)。この backend の health_check は本物の
      # generateContent を投げる ∴ /health の 1 回ごとに課金対象の推論が 1 回走り、
      # Google 側のレイテンシ (実測 中央値 1.2s) をそのまま /health が被る。
      # 異常が出ても運用側に打てる手が無いため、確認しない方を選ぶ。
      # backend 自体は有効 — naysayer はこれで動いている。
      health_check: false
      models:
        - name: "gemini-3.1-pro-preview"
          capabilities: ["code", "reasoning", "analysis", "general"]
          description: "Google Gemini 3.1 Pro Preview (naysayer, native generateContent)"

    # Claude Code CLI (non-interactive mode)
    claude_code:
      type: "claude_code"
      url: "localhost"  # unused but required by schema
      timeout: 600.0
      connect_timeout: 5.0
      models:
        - name: "claude-code-opus"
          capabilities: ["code", "reasoning", "analysis", "agentic"]
          description: "Claude Code (Opus) - agentic coding with tool use"
        - name: "claude-code-sonnet"
          capabilities: ["code", "reasoning", "general"]
          description: "Claude Code (Sonnet) - fast coding assistant"
      model_mapping:
        # CLI model arg (--model)
        "claude-code-opus": "opus"
        "claude-code-sonnet": "sonnet"
        # Extra config via model_mapping (factory reads these)
        "model": "sonnet"  # default CLI model
        "max_turns": "1"  # prevent agentic tool use for simple completions
        # "working_dir": "/home/sgadmin"

    # Anthropic Claude API
    claude:
      type: "anthropic"
      url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
      timeout: 120.0
      connect_timeout: 5.0
      # health probe を外す (2026-08-11)。gemini と同じく本物の /v1/messages を
      # 投げる。加えてこの backend の health_check は「5xx でなければ到達可能」と
      # 判定するため、ANTHROPIC_API_KEY 未設定でも 401 を healthy と報告していた
      # = リクエストを処理できない backend が healthy に見えていた。
      # 誤った緑を出し続けるくらいなら、確認していないと言う方がよい。
      health_check: false
      models:
        - name: "claude-sonnet-4-20250514"
          capabilities: ["code", "reasoning", "analysis", "general"]
          description: "Anthropic Claude Sonnet 4"

queue:
  max_size: 1000
  default_timeout: 60.0

rate_limit:
  enabled: true
  default_rate: 10.0
  default_burst: 20

retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 30.0
  exponential_base: 2.0
  respect_retry_after: true
  max_retry_after: 60.0

# fallback 機構は 2026-08-31 に撤去した。ここには `fallback: enabled / on_rate_limit`
# のセクションがあり、各 backend には `fallback_backends:` があった。
# 撤去した理由: `FallbackService` (src/lexora/services/fallback.py) は 73853e7 で
# 生まれてから一度も配線されたことが無い (main.py は構築せず routes.py は呼ばない)。
# ∴ 実行時にフォールバックは一度も走っていないのに、この config は
# `enabled: true` と `heavy: fallback_backends: ["claude"]` を出荷し続けていた =
# 運用者への偽の約束だった (upstream の 429 でフォールバックを期待するが、
# 実際にはルーティングごと失敗する)。
# 配線ではなく削除を選んだ理由: フォールバックを必要とする要求がどこにも無く、
# 唯一の落とし先 claude は ANTHROPIC_API_KEY 未設定 ∴ 配線したら「死んだテキスト」が
# 「本物の 401 格下げ」に化けるだけ。削除は可逆 (コードは git 履歴に残る)。
# 再導入するなら **実装が先で config は後**。機構より先に config を出荷しない。
# なお `BackendSettings` は extra="forbid" ∴ `fallback_backends:` が残っている
# config で起動すると create_settings が ValidationError で落ちる。これを
# 「fail-loud だから silent には壊れない」と読んではいけない: deploy/lexora.service
# は Restart=always / RestartSec=5 ∴ 落ちたプロセスは 5 秒ごとに再起動を試みる
# クラッシュループになり、journal を見ない限り観測される症状は「サービスが応答
# しない」だけになる。lexora が naysayer backend を提供している場合、その症状は
# 「独立レビューが返ってこない」として現れる。∴ 更新後の再起動前に検査すること。
#
# 検査行 (再起動の前に実行する):
#   grep -n fallback_backends /opt/lexora/config/lexora_config.yaml /etc/lexora/config.yaml
#
# repo 外の config コピーも同じ操作で更新すること。パスは /etc だけではない:
# config.py の探索順は config/lexora_config.yaml → lexora_config.yaml →
# /etc/lexora/config.yaml で、先頭 2 つは lexora.service の
# WorkingDirectory=/opt/lexora からの相対 ∴ README の手順どおりに入れた環境で
# 実際にロードされるのは /opt/lexora/config/lexora_config.yaml であり、これが
# /etc/lexora/config.yaml を shadow する。/etc だけを見ると false all-clear が出る。

logging:
  level: "INFO"
  format: "json"
